<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Cadastro</title>
  <style> 
    form {
        max-width: 800px;
        margin: 5 auto;
        padding: 60px;
        background-color: rgb(132, 233, 251);
        border-radius: 24px;
        box-shadow: 5 8px 30px red(0, 0, 0, 0.08);
    }

    fieldset {
        margin-bottom: 50px;
        padding: 40px;
        border: 2px solid hotpink;
        border-radius: 20px;
        background-color: chartreuse;
    }

    </style>
</head>
<body>

<div class="container">
  <h2>Cadastro de Usuário</h2>
  <form id="cadForm">
    <div class="form-group">
      <label for="nome">Nome Completo *</label>
      <input type="text" id="nome" required placeholder="Digite seu nome">
    </div>

    <div class="form-group">
      <label for="email">E-mail *</label>
      <input type="email" id="email" required placeholder="exemplo@email.com">
    </div>

    <div class="form-group">
      <label for="cpf">CPF (somente números, máx. 11) *</label>
      <input type="text" id="cpf" maxlength="11" required placeholder="12345678901">
      <span class="error-msg" id="cpfError">O CPF deve ter no máximo 11 caracteres (apenas números).</span>
    </div>

    <div class="form-group">
      <label for="telefone">Telefone *</label>
      <input type="tel" id="telefone" required placeholder="(00) 00000-0000">
    </div>

    <button type="submit">CADASTRAR</button>
  </form>
</div>

<script>
  document.getElementById('cadForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const nome = document.getElementById('nome').value.trim();
    const email = document.getElementById('email').value.trim();
    const cpf = document.getElementById('cpf').value.trim();
    const telefone = document.getElementById('telefone').value.trim();
    const cpfError = document.getElementById('cpfError');

    // Validação do tamanho do CPF (máximo 11 caracteres e apenas números)
    const cpfRegexp = /^[0-9]{1,11}$/;
    if (!cpfRegexp.test(cpf)) {
      cpfError.style.display = 'block';
      return;
    } else {
      cpfError.style.display = 'none';
    }

    // Salvar no localStorage para carregar na segunda página
    const dadosUsuario = { nome, email, cpf, telefone };
    localStorage.setItem('dadosCadastro', JSON.stringify(dadosUsuario));

    // Redireciona para a segunda página
    window.location.href = 'resultado.html';
  });
</script>

</body>
</html>
  </style>
