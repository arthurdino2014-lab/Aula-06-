<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Cadastro</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 450px;
    }
    h2 {
      margin-top: 0;
      color: #333;
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    input:focus, select:focus {
      border-color: #007bff;
      outline: none;
    }
    .error-msg {
      color: #dc3545;
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Cadastro de Usuário</h2>
  <form id="cadForm">
    <div class="form-group">
      <label for="nome">Nome Completo *</label>
      <input type="text" id="nome" required placeholder="Digite seu nome">
    </div>

    <div class="form-group">
      <label for="email">E-mail *</label>
      <input type="email" id="email" required placeholder="exemplo@email.com">
    </div>

    <div class="form-group">
      <label for="cpf">CPF (somente números, máx. 11) *</label>
      <input type="text" id="cpf" maxlength="11" required placeholder="12345678901">
      <span class="error-msg" id="cpfError">O CPF deve ter no máximo 11 caracteres (apenas números).</span>
    </div>

    <div class="form-group">
      <label for="telefone">Telefone *</label>
      <input type="tel" id="telefone" required placeholder="(00) 00000-0000">
    </div>

    <button type="submit">CADASTRAR</button>
  </form>
</div>

<script>
  document.getElementById('cadForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const nome = document.getElementById('nome').value.trim();
    const email = document.getElementById('email').value.trim();
    const cpf = document.getElementById('cpf').value.trim();
    const telefone = document.getElementById('telefone').value.trim();
    const cpfError = document.getElementById('cpfError');

    // Validação do tamanho do CPF (máximo 11 caracteres e apenas números)
    const cpfRegexp = /^[0-9]{1,11}$/;
    if (!cpfRegexp.test(cpf)) {
      cpfError.style.display = 'block';
      return;
    } else {
      cpfError.style.display = 'none';
    }

    // Salvar no localStorage para carregar na segunda página
    const dadosUsuario = { nome, email, cpf, telefone };
    localStorage.setItem('dadosCadastro', JSON.stringify(dadosUsuario));

    // Redireciona para a segunda página
    window.location.href = 'resultado.html';
  });
</script>

</body>
</html>
